name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25'

    - name: Cache Go modules
      uses: actions/cache@v3
      with:
        path: ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-

    - name: Install dependencies
      run: go mod tidy

    - name: Run tests
      run: go test ./... -v -race

    - name: Build
      run: go build ./cmd/solide

  build-all:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.25'
    
    - name: Build for all platforms
      run: |
        mkdir -p dist
        GOOS=linux GOARCH=amd64 go build -o dist/solide-linux-amd64 ./cmd/solide
        GOOS=darwin GOARCH=amd64 go build -o dist/solide-darwin-amd64 ./cmd/solide
        GOOS=darwin GOARCH=arm64 go build -o dist/solide-darwin-arm64 ./cmd/solide
        GOOS=windows GOARCH=amd64 go build -o dist/solide-windows-amd64.exe ./cmd/solide
    
    - name: Upload binaries
      uses: actions/upload-artifact@v4
      with:
        name: solide-binaries
        path: dist/